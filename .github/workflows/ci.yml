name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify syntax and run demo worker
        run: |
          python3 -m py_compile __init__.py examples/autonomous_worker.py
          python3 examples/autonomous_worker.py --demo
